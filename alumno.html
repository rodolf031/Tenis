<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Alumno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h2 id="nombre-alumno">Bienvenido, Alumno</h2>
        <div class="horas-container">
            <span>Horas disponibles: </span>
            <strong id="saldo-horas">0</strong>
        </div>
        <button id="btn-comprar-horas">Comprar Paquete</button>
        <button id="btn-logout">Cerrar Sesión</button>
    </header>

    <main>
        <section id="notificaciones-container"></section>

        <section class="clases-section">
            <h3>Clases Disponibles</h3>
            <div id="lista-clases-disponibles">
                </div>
        </section>
    </main>

    <script src="js/mock_data.js"></script>
    <script src="js/vista_alumno.js"></script>
</body>
</html>
