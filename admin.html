<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h2>Panel del Profesor</h2>
        <button id="btn-logout">Cerrar Sesión</button>
    </header>

    <main>
        <section class="admin-grid">
            <div class="form-container">
                <h3>Programar Nueva Clase</h3>
                <form id="form-crear-clase">
                    <input type="date" id="fecha-clase" required>
                    <input type="time" id="hora-clase" required>
                    <select id="sede-clase" required>
                        </select>
                    <select id="nivel-clase" required>
                        </select>
                    <input type="number" id="capacidad-clase" min="4" max="8" placeholder="Capacidad (4-8)" required>
                    <button type="submit">Crear Clase</button>
                </form>
            </div>

            <div class="list-container">
                <h3>Gestión de Alumnos</h3>
                <div id="lista-alumnos">
                    </div>
            </div>
        </section>
    </main>

    <script src="js/mock_data.js"></script>
    <script src="js/vista_admin.js"></script>
</body>
</html>
